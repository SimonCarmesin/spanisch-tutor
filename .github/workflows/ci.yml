name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://tutor:tutor@localhost:5432/tutor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # Migrationen gegen echtes PostgreSQL, und Abgleich mit den Modellen
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
        working-directory: frontend
      # Vertrag zwischen Backend und Frontend: Die Typen müssen zur aktuellen API passen
      - name: API-Typen aktuell?
        run: |
          cd backend && uv sync --frozen && uv run python ../scripts/export-openapi.py ../frontend/openapi.json
          cd ../frontend && npm run api:types
          git diff --exit-code -- openapi.json src/api/schema.d.ts \
            || (echo "API-Typen veraltet: bitte 'make api-types' ausführen und committen" && exit 1)
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose-and-image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Datei prüfen
        env:
          AI_HUB_BASE_URL: https://example.invalid
          AI_HUB_API_KEY: dummy
          POSTGRES_PASSWORD: dummy
          LITELLM_MASTER_KEY: sk-dummy
          TUTOR_API_TOKEN: dummy
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
